<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <title>Rekap Bulanan Absensi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
        }

        h1 {
            margin-bottom: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input,
        button {
            padding: 8px 10px;
            border-radius: 4px;
            border: 0;
        }

        button {
            cursor: pointer;
            background: #22c55e;
            color: #052e16;
            font-weight: bold;
        }

        button.secondary {
            background: #38bdf8;
            color: #082f49;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #020617;
        }

        th,
        td {
            padding: 8px;
            border: 1px solid #1e293b;
            text-align: center;
        }

        th {
            background: #020617;
            color: #22c55e;
        }

        tr:nth-child(even) {
            background: #020617;
        }

        .right {
            text-align: right;
        }

        .muted {
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📊 Rekap Bulanan Absensi</h1>

        <div class="toolbar">
            <input type="month" id="periode" />
            <button onclick="loadRekap()">🔄 Tampilkan</button>
            <button class="secondary" onclick="exportExcel()">⬇ Export Excel</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID Karyawan</th>
                    <th>Nama</th>
                    <th>Total Masuk</th>
                    <th>Alpa (Hari)</th>
                    <th>Telat (Kali)</th>
                    <th>Telat (Menit)</th>
                    <th>Pulang (Kali)</th>
                    <th>Lupa Pulang (Kali)</th>
                    <th>Potongan (Jam)</th>
                    <th>Total Jam Kerja</th>
                </tr>
            </thead>
            <tbody id="rekapBody">
                <tr>
                    <td colspan="9" class="muted">Silakan pilih periode</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="rekap.js"></script>
</body>

</html>
