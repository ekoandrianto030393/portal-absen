<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Biometrik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #05050A;
            color: #00FFFF;
        }

        .btn-menu {
            display: block;
            padding: 1.5rem;
            border: 1px solid #00FFFF;
            background: rgba(0, 255, 255, 0.1);
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            transition: all 0.3s;
            text-decoration: none;
            color: #00FFFF;
            border-radius: 8px;
        }

        .btn-menu:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px #00FFFF;
            transform: scale(1.02);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">

    <div
        class="w-full max-w-2xl p-8 border border-cyan-500/30 rounded-xl bg-gray-900/80 backdrop-blur shadow-[0_0_50px_rgba(0,255,255,0.1)]">
        <h1 class="text-4xl font-bold text-center mb-8 tracking-widest border-b border-cyan-500/50 pb-4">
            PUSKESMAS WANA<br>
            <span class="text-xl text-cyan-400 font-normal">BIOMETRIC ACCESS HUB</span>
        </h1>

        <div class="grid grid-cols-1 gap-6">
            <a href="/scan.html" class="btn-menu">
                📷 SCAN WAJAH (ABSENSI)
                <p class="text-sm font-normal text-gray-400 mt-1">Masuk ke terminal pemindaian wajah</p>
            </a>

            <!-- Link API untuk testing -->
            <div class="grid grid-cols-2 gap-4">
                <a href="/api/monitoring/stats" target="_blank" class="btn-menu text-lg">
                    📊 API STATS
                    <p class="text-xs text-gray-400">JSON Data</p>
                </a>
                <a href="/api/rekap" target="_blank" class="btn-menu text-lg">
                    📑 API REKAP
                    <p class="text-xs text-gray-400">JSON Data</p>
                </a>
            </div>
        </div>

        <div class="mt-8 text-center text-xs text-gray-500">
            SERVER STATUS: <span class="text-green-500">ONLINE</span> | PORT: 3000
        </div>
    </div>

</body>

</html>
