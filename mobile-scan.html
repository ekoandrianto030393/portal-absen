<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Biometrik - Dinas Luar</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            margin: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ═══ FULL-SCREEN CAMERA ═══ */
        .cam-layer {
            position: fixed; inset: 0;
            z-index: 0;
            background: #000;
        }
        .cam-layer video {
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .cam-layer canvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
            transform: scaleX(-1);
        }

        /* ═══ SAFE AREA ═══ */
        .safe-t { padding-top: max(12px, env(safe-area-inset-top)); }
        .safe-b { padding-bottom: max(16px, env(safe-area-inset-bottom)); }

        /* ═══ ANIMATED SCAN LINE ═══ */
        .scanline {
            position: absolute; left: 0; width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(0,230,180,0.9) 30%, rgba(56,189,248,0.9) 70%, transparent 100%);
            box-shadow: 0 0 18px 4px rgba(0,230,180,0.5);
            animation: scanMove 2.8s ease-in-out infinite alternate;
            z-index: 3; pointer-events: none;
        }
        @keyframes scanMove {
            0%   { top: 8%; opacity: .6; }
            100% { top: 92%; opacity: .9; }
        }

        /* ═══ CORNER BRACKETS ═══ */
        .corner { position: absolute; width: 28px; height: 28px; z-index: 4; }
        .corner-tl { top: 40px; left: 20px;  border-top: 2.5px solid; border-left: 2.5px solid; border-radius: 6px 0 0 0; }
        .corner-tr { top: 40px; right: 20px; border-top: 2.5px solid; border-right: 2.5px solid; border-radius: 0 6px 0 0; }
        .corner-bl { bottom: 40px; left: 20px;  border-bottom: 2.5px solid; border-left: 2.5px solid; border-radius: 0 0 0 6px; }
        .corner-br { bottom: 40px; right: 20px; border-bottom: 2.5px solid; border-right: 2.5px solid; border-radius: 0 0 6px 0; }
        .corner { border-color: rgba(56, 189, 248, 0.55); }

        /* ═══ TITLE TEXT GRADIENT ═══ */
        .text-title-glow {
            background: linear-gradient(135deg, #fff 0%, #7dd3fc 35%, #38bdf8 55%, #a78bfa 80%, #fff 100%);
            background-size: 250% auto;
            -webkit-background-clip: text; background-clip: text;
            color: transparent; -webkit-text-fill-color: transparent;
            animation: titleShimmer 4s linear infinite;
            filter: drop-shadow(0 0 10px rgba(56,189,248,0.4));
        }
        @keyframes titleShimmer {
            0%   { background-position: 0% center; }
            100% { background-position: 250% center; }
        }

        /* ═══ GLASS PANEL ═══ */
        .glass {
            background: linear-gradient(145deg, rgba(15,23,42,0.72), rgba(8,12,28,0.78));
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(56,189,248,0.18);
        }

        /* ═══ PILL BADGE ═══ */
        .pill {
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 11px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 5px;
            transition: all .3s ease;
        }
        .pill--warn  { color: #fbbf24; border-color: rgba(251,191,36,0.25); }
        .pill--ok    { color: #34d399; border-color: rgba(52,211,153,0.25); }
        .pill--err   { color: #f87171; border-color: rgba(248,113,113,0.25); }

        /* ═══ IDENTITY CARD ═══ */
        .id-card {
            background: linear-gradient(140deg, rgba(15,23,42,0.80), rgba(30,20,50,0.75));
            backdrop-filter: blur(30px) saturate(170%);
            -webkit-backdrop-filter: blur(30px) saturate(170%);
            border: 1px solid rgba(167,139,250,0.30);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
            transition: opacity .4s ease, transform .4s ease;
        }

        .id-avatar {
            width: 56px; height: 56px;
            border-radius: 14px;
            border: 2px solid rgba(167,139,250,0.5);
            box-shadow: 0 0 18px rgba(167,139,250,0.3);
            overflow: hidden;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(167,139,250,0.08);
        }
        .id-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .id-score {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 2.5px solid rgba(52,211,153,0.6);
            background: rgba(52,211,153,0.08);
            box-shadow: 0 0 12px rgba(52,211,153,0.25), inset 0 0 6px rgba(52,211,153,0.2);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-weight: 900; font-size: 11px; color: #6ee7b7;
        }

        /* ═══ ACTION BUTTON ═══ */
        .btn-action {
            width: 100%;
            padding: 16px 0;
            border-radius: 16px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 17px;
            letter-spacing: 0.12em;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer;
            transition: all .2s cubic-bezier(.4,0,.2,1);
            position: relative; overflow: hidden;
        }
        .btn-action::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 60%);
            pointer-events: none;
        }
        .btn-action--ready {
            background: linear-gradient(135deg, #34d399 0%, #38bdf8 50%, #a78bfa 100%);
            color: #0f172a;
            box-shadow: 0 8px 30px rgba(52,211,153,0.35), 0 4px 12px rgba(56,189,248,0.25);
            text-shadow: 0 1px 1px rgba(255,255,255,0.2);
        }
        .btn-action--ready:active {
            transform: scale(.96) translateY(2px);
            box-shadow: 0 2px 10px rgba(52,211,153,0.3);
        }
        .btn-action--disabled {
            background: linear-gradient(135deg, rgba(30,40,55,0.9), rgba(15,20,30,0.95));
            color: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: none;
            text-shadow: none;
            pointer-events: none;
        }

        /* ═══ COORD BOX ═══ */
        .coord-box {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56,189,248,0.15);
            border-radius: 16px;
            padding: 12px 16px;
            text-align: center;
        }

        /* ═══ SWEEP ═══ */
        @keyframes sweep {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }

        /* ═══ PULSE RING ═══ */
        @keyframes pulseRing {
            0%   { box-shadow: 0 0 0 0 rgba(52,211,153,0.5); }
            70%  { box-shadow: 0 0 0 12px rgba(52,211,153,0); }
            100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
        }
        .pulse-ring { animation: pulseRing 1.5s infinite; }

        /* ═══ VIGNETTE ═══ */
        .vignette {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse 70% 70% at center, transparent 40%, rgba(0,0,0,0.55) 100%);
            pointer-events: none; z-index: 1;
        }
    </style>
</head>
<body>

    <!-- ═══════════ CAMERA LAYER (BACKGROUND) ═══════════ -->
    <div class="cam-layer">
        <video id="video-feed" autoplay playsinline muted></video>
        <canvas id="face-canvas"></canvas>
        <div class="vignette"></div>
        <div class="scanline"></div>
        <!-- Corner Brackets -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
    </div>

    <!-- ═══════════ UI OVERLAY ═══════════ -->
    <div class="relative z-10 flex flex-col h-full pointer-events-none" style="height:100dvh;">

        <!-- ── TOP BAR ── -->
        <header class="w-full px-5 safe-t bg-gradient-to-b from-black/75 via-black/35 to-transparent pointer-events-auto pb-5">
            <div class="flex justify-between items-center mt-3">
                <div>
                    <h1 class="text-[24px] font-black tracking-tight text-title-glow uppercase leading-tight">Dinas Luar</h1>
                    <p class="text-[11px] text-sky-300/90 font-semibold tracking-[0.18em] mt-0.5" style="text-shadow:0 1px 4px rgba(0,0,0,.9);">
                        <i class="fa-solid fa-satellite-dish mr-1 text-[9px]"></i>MOBILE BIOMETRIC SCAN
                    </p>
                </div>
                <button onclick="window.location.href='index.html'" class="w-10 h-10 rounded-full glass flex items-center justify-center text-sky-300 active:scale-90 transition-transform shadow-lg">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <!-- Status Pills -->
            <div class="flex items-center gap-2.5 mt-4 flex-wrap">
                <div id="gps-status" class="pill pill--warn animate-pulse">
                    <i class="fa-solid fa-location-crosshairs"></i>
                    <span>Mencari GPS...</span>
                </div>
                <div id="model-status" class="pill pill--warn animate-pulse">
                    <i class="fa-solid fa-microchip"></i>
                    <span>Memuat AI...</span>
                </div>
            </div>
        </header>

        <!-- ── IDENTITY CARD (CENTER) ── -->
        <div class="flex-1 flex flex-col items-center justify-center px-5 pointer-events-auto">
            <div id="identity-panel" class="id-card w-full max-w-sm flex items-center gap-4 opacity-0 translate-y-4">
                <!-- Sweep Light -->
                <div class="absolute inset-0 rounded-[20px] overflow-hidden pointer-events-none">
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/[0.07] to-transparent" style="animation: sweep 2.5s ease-in-out infinite;"></div>
                </div>

                <div class="id-avatar">
                    <img id="detected-photo" src="" class="hidden">
                    <i id="detected-icon" class="fa-solid fa-user text-2xl text-violet-300"></i>
                </div>

                <div class="flex-grow min-w-0 relative">
                    <p id="detected-name" class="font-extrabold text-[18px] text-white truncate leading-tight" style="text-shadow:0 2px 6px rgba(0,0,0,1);">Menunggu Wajah...</p>
                    <p id="detected-job" class="text-[11px] text-violet-300 font-bold uppercase tracking-[0.15em] truncate mt-1" style="text-shadow:0 1px 3px rgba(0,0,0,1);">—</p>
                </div>

                <div id="match-score" class="id-score hidden">—</div>
            </div>
        </div>

        <!-- ── BOTTOM BAR ── -->
        <footer class="w-full px-5 pt-6 safe-b bg-gradient-to-t from-black/90 via-black/60 to-transparent pointer-events-auto">
            <div class="max-w-md mx-auto w-full pb-4 flex flex-col gap-3.5">

                <!-- Coordinate Box -->
                <div class="coord-box">
                    <div class="text-[10px] text-sky-400/80 font-bold uppercase tracking-[0.2em] mb-1 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-map-pin text-[8px]"></i> Koordinat Anda
                    </div>
                    <p id="location-text" class="text-[13px] text-white/90 font-mono tracking-wider" style="text-shadow:0 1px 3px rgba(0,0,0,.8);">Sedang mencari...</p>
                </div>

                <!-- Action Button -->
                <button id="btn-submit" disabled class="btn-action btn-action--disabled">
                    <i class="fa-solid fa-fingerprint text-xl"></i>
                    <span>ABSEN DINAS LUAR</span>
                </button>

            </div>
        </footer>
    </div>

    <!-- ═══════════ SCRIPTS ═══════════ -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="mobile-scan.js"></script>
</body>
</html>
