<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Control - Biometric Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --aether-blue: #00eaff;
            --holo-violet: #8a2be2;
            --border-color: rgba(0, 234, 255, 0.5);
            --bg-dark: rgba(0, 0, 0, 0.4);
            --grid-color: rgba(0, 234, 255, 0.1);
            --status-green: #39FF14;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            color: var(--aether-blue);
            background-color: #0d0d0d;
            overflow-x: hidden;
        }

        .animated-divider {
            animation: color-shift 5s infinite ease-in-out alternate;
            border-bottom: 2px solid var(--border-color);
        }

        @keyframes color-shift {
            0% {
                border-color: var(--aether-blue);
                box-shadow: 0 0 5px var(--aether-blue);
            }

            100% {
                border-color: var(--holo-violet);
                box-shadow: 0 0 5px var(--holo-violet);
            }
        }

        .holo-panel {
            background-color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(0, 234, 255, 0.2);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
        }

        .video-container {
            position: relative;
            border: 2px solid var(--aether-blue);
            overflow: hidden;
            background: #000;
        }

        #videoElement {
            transform: scaleX(-1);
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--aether-blue), transparent);
            animation: scan 3s infinite linear;
            box-shadow: 0 0 15px var(--aether-blue);
            z-index: 10;
        }

        @keyframes scan {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(100% / 1);
                top: 100%;
            }
        }

        .threshold-fill {
            height: 100%;
            width: 0%;
            background-color: var(--aether-blue);
            transition: width 0.1s linear;
            box-shadow: 0 0 10px var(--aether-blue);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-7xl relative z-10">
        <a href="index.html"
            class="absolute top-0 left-0 text-cyan-400 hover:text-white border border-cyan-400 px-3 py-1 rounded uppercase text-xs tracking-widest transition-colors">
            &lt; ACCESS CONTROL
        </a>
        <h1 class="text-4xl font-extrabold mb-8 text-center uppercase tracking-widest text-white">
            AETHER-QCM: QUANTUM CONTROL MATRIX
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="holo-panel p-6 rounded-2xl">
                <h2 class="text-xl font-bold mb-4 pb-2 border-b border-indigo-500 uppercase">SUBJECT DATA INPUT</h2>

                <div class="space-y-5">
                    <div>
                        <label class="text-xs text-indigo-400 block">EMPLOYEE ID</label>
                        <input type="text" id="regIdKaryawan" placeholder="K001"
                            class="w-full p-2 bg-transparent border-b-2 border-indigo-600 focus:outline-none uppercase text-white">
                    </div>
                    <div>
                        <label class="text-xs text-indigo-400 block">FULL NAME</label>
                        <input type="text" id="regNama" placeholder="NAMA subjek"
                            class="w-full p-2 bg-transparent border-b-2 border-indigo-600 focus:outline-none text-white">
                    </div>
                    <div>
                        <label class="text-xs text-indigo-400 block">POSITION</label>
                        <input type="text" id="regJabatan" placeholder="STAFF"
                            class="w-full p-2 bg-transparent border-b-2 border-indigo-600 focus:outline-none text-white">
                    </div>
                    <div>
                        <label class="text-xs text-indigo-400 block">CAMERA SOURCE</label>
                        <select id="cameraSelect"
                            class="w-full p-2 bg-transparent border-b-2 border-indigo-600 focus:outline-none text-white"></select>
                    </div>

                    <div class="mt-6">
                        <div class="flex justify-between text-xs mb-1">
                            <span>BIOMETRIC QUALITY</span>
                            <span id="thresholdStatus">0%</span>
                        </div>
                        <div class="h-2 bg-gray-800 rounded-full overflow-hidden">
                            <div id="thresholdFill" class="threshold-fill"></div>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-4">
                        <button id="btnReset" type="button"
                            class="flex-1 bg-gray-800 text-gray-400 font-bold py-3 px-2 rounded-lg uppercase hover:bg-gray-700 border border-gray-600 transition-all text-sm">
                            RESET
                        </button>
                        <button id="btnRegister" disabled
                            class="flex-[2] bg-indigo-900 text-white font-bold py-3 px-4 rounded-lg uppercase text-center transition-all opacity-50 cursor-not-allowed hover:bg-indigo-800 shadow-lg border border-indigo-500">
                            <span id="btnText">WAITING...</span>
                        </button>
                    </div>
                </div>
            </div>


            <div class="holo-panel p-4 rounded-2xl">
                <h2 class="text-xl font-bold mb-4 pb-2 border-b border-indigo-500 uppercase text-center">VISUAL ANALYZER
                </h2>
                <div class="video-container rounded-xl aspect-[4/3]">
                    <video id="videoElement" autoplay muted playsinline class="w-full h-full object-cover"></video>
                    <canvas id="overlay" class="absolute top-0 left-0 w-full h-full"></canvas>
                    <div id="flashEffect" class="absolute inset-0 bg-white opacity-0 pointer-events-none"></div>
                    <div class="scanner-line"></div>
                </div>
                <p id="faceStatus" class="text-lg text-center mt-4 text-red-500 font-bold uppercase">INITIATING...</p>
                <canvas id="snapshotCanvas" style="display:none;" width="640" height="480"></canvas>
            </div>

            <div class="holo-panel p-6 rounded-2xl flex flex-col">
                <h2 class="text-xl font-bold mb-4 pb-2 border-b border-indigo-500 uppercase">SYSTEM LOG STREAM</h2>
                <div id="logStream" class="flex-1 overflow-y-auto text-[10px] space-y-1 font-mono text-cyan-400"></div>
            </div>
        </div>
    </div>

    <div id="regSuccessOverlay"
        class="fixed inset-0 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center z-[100] hidden">
        <div class="text-center p-10 border-2 border-green-500 rounded-2xl">
            <h2 class="text-4xl font-bold text-green-500 mb-4 uppercase tracking-tighter">:: ARCHIVED ::</h2>
            <p class="text-white text-lg">DATA BIOMETRIK BERHASIL DISIMPAN</p>
            <p class="text-gray-400 mt-2">ID: <span id="overlayRegId" class="text-white"></span></p>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
