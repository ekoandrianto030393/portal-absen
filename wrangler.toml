name = "biometrik-tts-worker" # Replace with a unique name for your worker
main = "cloudflare-worker-tts.js"
compatibility_date = "2024-05-18" # Update to today's date or a recent one

# No build section is needed for a simple worker script
# If you were using a bundler like Webpack or Rollup, you would configure it here.
# Since it's a single JS file, Wrangler can deploy it directly.

[ai]
binding = "AI"
